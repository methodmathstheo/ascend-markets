<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" font-family="Google Sans, Arial, sans-serif" font-size="12" role="img" aria-label="Big Tech AI bond issuance in 2026 to 7 July" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
