<text x="12" y="48" fill="#c3c9d6">Amazon, Alphabet, Meta, and Oracle had issued about $194 billion of bonds in 2026</text>
<text x="12" y="64" fill="#c3c9d6">through July 7. Alphabet&#8217;s current deal could add as much as $25 billion.</text>
